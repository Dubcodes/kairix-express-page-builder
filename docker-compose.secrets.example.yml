services:
  admin:
    environment:
      SESSION_SECRET_FILE: /run/kairix-secrets/session-secret
      ENCRYPTION_SECRET_FILE: /run/kairix-secrets/encryption-secret
      CLOUDFLARE_API_TOKEN_FILE: /run/kairix-secrets/cloudflare-api-token
    volumes:
      - type: bind
        source: ${KAIRIX_SECRETS_DIR:-/opt/kairix-express-page-builder/secrets}/session-secret
        target: /run/kairix-secrets/session-secret
        read_only: true
      - type: bind
        source: ${KAIRIX_SECRETS_DIR:-/opt/kairix-express-page-builder/secrets}/encryption-secret
        target: /run/kairix-secrets/encryption-secret
        read_only: true
      - type: bind
        source: ${KAIRIX_SECRETS_DIR:-/opt/kairix-express-page-builder/secrets}/cloudflare-api-token
        target: /run/kairix-secrets/cloudflare-api-token
        read_only: true
