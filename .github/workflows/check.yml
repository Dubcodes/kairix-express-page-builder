name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax checks
        run: |
          node --check admin/src/config.js
          node --check admin/src/server.js
          node --check admin/src/providers/deploy.js
          node --check admin/src/services/publish.js
          node --check admin/src/services/exportData.js
          node --check admin/src/services/secrets.js
          node --check admin/src/services/requestSecurity.js
          node --check admin/src/services/processEnvironment.js
          node --check admin/src/services/uploadValidation.js
          node --check admin/src/public/assets/admin.js
          node --check admin/src/public/assets/invite.js
          node --check admin/src/public/assets/reset.js
          node --check site/src/lib/contentLoader.js
          node --check scripts/check-live-content-build.mjs
          node --check scripts/smoke-server.mjs

      - name: Build and check
        run: npm run check

      - name: Public output scan
        run: |
          PUBLIC_SCAN_ROOT=.cache/live-content-build/cloudflare-workers-root \
          PUBLIC_SCAN_BASE_PATH= \
          PUBLIC_SCAN_STATIC_ONLY=true \
          npm run scan:public
          PUBLIC_SCAN_ROOT=.cache/live-content-build/cloudflare-workers-root \
          PUBLIC_SCAN_BASE_PATH= \
          npm run check:links

      - name: Dependency audit
        run: npm audit --omit=dev

      - name: Docker Compose config
        run: docker compose config
